name: 📦 Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (leave empty for latest commit)'
        required: false
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Baked into dist/ at build time (src/defined.ts). These must be the LIVE
      # hosts: the old *.service.alternatefutures.ai names no longer resolve to
      # anything with a certificate (checked 2026-09-10), so a package built with
      # them fails every request unless the user overrides the env.
      SDK__AUTH_SERVICE_URL: "https://auth.alternatefutures.ai"
      SDK__AUTH_APPS_URL: "https://auth.alternatefutures.ai"
      SDK__GRAPHQL_API_URL: "https://api.alternatefutures.ai/graphql"
      # Retired hosting-era endpoints. Only ipfs()/storage() use them; pointing
      # them at the API host keeps construction working until they are removed.
      SDK__IPFS__STORAGE_API_URL: "https://api.alternatefutures.ai"
      SDK__UPLOAD_PROXY_API_URL: "https://api.alternatefutures.ai"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.12.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # `pnpm run build` ends with `bun run ./build.ts`; the runner has no Bun.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build package
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Publish to npm with provenance
        run: npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "## 📦 Package Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** @alternatefutures/sdk" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $(node -p "require('./package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** https://www.npmjs.com/package/@alternatefutures/sdk" >> $GITHUB_STEP_SUMMARY
          echo "**Provenance:** ✅ Enabled (verifiable build attestation)" >> $GITHUB_STEP_SUMMARY

